<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<title>QuickBite | Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="logo" href="home.html">Quick<span>Bite</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Log in to continue your order.</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label><input id="email" type="email" required>
        <div class="form-error" id="email-error"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label><input id="password" type="password" minlength="6" required>
        <div class="form-error" id="password-error"></div>
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="muted">Don't have an account? <a href="signup.html" style="color:var(--red);font-weight:700">Sign up</a></p>
  </div>
</main>
<script>
document.querySelector("#login-form").addEventListener("submit", event => {
  event.preventDefault();
  const email = document.querySelector("#email");
  const password = document.querySelector("#password");
  document.querySelector("#email-error").textContent = email.validity.valid ? "" : "Enter a valid email.";
  document.querySelector("#password-error").textContent = password.validity.valid ? "" : "Password must be at least 6 characters.";
  if (email.validity.valid && password.validity.valid) {
    alert("Frontend demo only: login is not connected to an authentication API.");
    window.location.href = "home.html";
  }
});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite | Signup</title><link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="logo" href="home.html">Quick<span>Bite</span></a>
    <h1>Create account</h1>
    <p class="muted">Create your QuickBite profile.</p>
    <form id="signup-form">
      <div class="form-group"><label for="name">Name</label><input id="name" type="text" required></div>
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="6" required></div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" minlength="6" required>
        <div class="form-error" id="confirm-error"></div>
      </div>
      <button class="btn btn-primary" type="submit">Sign Up</button>
    </form>
    <p class="muted">Already have an account? <a href="login.html" style="color:var(--red);font-weight:700">Login</a></p>
  </div>
</main>
<script>
document.querySelector("#signup-form").addEventListener("submit", event => {
  event.preventDefault();
  const password = document.querySelector("#password").value;
  const confirm = document.querySelector("#confirm-password").value;
  const error = document.querySelector("#confirm-error");
  if (password !== confirm) {
    error.textContent = "Passwords do not match.";
    return;
  }
  error.textContent = "";
  alert("Frontend demo only: signup is not connected to an authentication API.");
  window.location.href = "login.html";
});
</script>
</body></html>

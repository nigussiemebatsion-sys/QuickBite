<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite | Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="logo" href="home.html">Quick<span>Bite</span></a>
    <button class="menu-toggle" aria-label="Open navigation">☰</button>
    <nav class="nav-links">
      <a class="" href="home.html">Home</a>
      <a class="" href="menu.html">Menu</a>
      <a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a>
      <a class="" href="login.html">Login</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Almost There</span>
      <h1 class="page-title">Checkout</h1>
      <p>Enter your delivery details and review your order.</p>
    </div>
  </section>
  <section class="section" style="padding-top:10px">
    <div class="container checkout-grid">
      <div class="panel">
        <h2>Delivery Details</h2>
        <form id="checkout-form">
          <div class="form-group">
            <label for="customer-name">Customer Name</label>
            <input id="customer-name" type="text" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" inputmode="numeric" pattern="[0-9]+" title="Phone number must contain digits only" required>
          </div>
          <div class="form-group">
            <label for="address">Delivery Address</label>
            <input id="address" type="text" required>
          </div>
          <button class="btn btn-primary" type="submit">Place Order</button>
        </form>
      </div>
      <div class="panel">
        <h2>Your Order</h2>
        <div id="order-items"></div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <strong id="checkout-total">0.00 ETB</strong>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>

<footer class="site-footer">
  <div class="container footer-content">
    <a class="logo" href="home.html">Quick<span>Bite</span></a>
    <p>Authentic Ethiopian flavors, made for every bite.</p>
    <small>© 2026 QuickBite</small>
  </div>
</footer>
</body>
</html>
